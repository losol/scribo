name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # The package publishes source with types from dist, so a passing build
      # is not proof the tarball is complete — check what npm would ship.
      - name: Verify the publishable tarball
        working-directory: packages/scribo
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          for f in src/main.tsx dist/main.d.ts dist/scribo.css \
                   src/nodes/schedule/index.ts dist/nodes/schedule/index.d.ts \
                   src/nodes/callout/index.ts dist/nodes/callout/index.d.ts \
                   README.md LICENSE.md CHANGELOG.md; do
            grep -q " $f\$" /tmp/pack.log || { echo "::error::$f missing from the tarball"; exit 1; }
          done

      # README and LICENSE exist twice: the copy in the repository root is what
      # GitHub renders, the copy in the package is what npm renders. Neither
      # tool reads the other's copy, so both have to be kept in step.
      - name: Verify the duplicated README and LICENSE match
        run: |
          set -euo pipefail
          for f in README.md LICENSE.md; do
            cmp -s "$f" "packages/scribo/$f" ||
              { echo "::error::$f and packages/scribo/$f have drifted apart"; exit 1; }
          done
