name: Release Scribo

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      # Publishing authenticates with npm trusted publishing (OIDC), not a token.
      # The trusted publisher registered on npmjs.com must name this repository and
      # this workflow file, or the token exchange 404s and the publish is anonymous.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          version-script: pnpm changeset version
          publish-script: pnpm publish -r --access public --provenance
